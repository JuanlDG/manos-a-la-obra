<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Construcción Misiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F5; --card:#FFFFFF; --ink:#11181F; --mute:#4A5663; --concrete:#C8D0DA; --tint:#E4E9EE;
  --tape:#F5C400; --plan:#1F4E79; --danger:#B3261E;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#12181E;--card:#1B232B;--ink:#EEF1F4;--mute:#A5B1BD;--concrete:#3A4856;--tint:#242E38;--plan:#7FB2E5;--danger:#FF8A80;color-scheme:dark}
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 var(--body);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--plan);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 56px}

/* Cabecera */
.top{padding:22px 0 6px;text-align:center}
.brand{font:800 clamp(2.2rem,9vw,3.4rem)/1 var(--display);letter-spacing:.01em;text-decoration:none;display:inline-block}
.nav{display:flex;justify-content:center;gap:clamp(8px,4vw,28px);margin:14px 0 26px}
.nav a{padding:8px 4px 6px;text-decoration:none;font-weight:700;border-bottom:4px solid transparent}
.nav a[aria-current="page"]{border-bottom-color:var(--tape)}
.nav svg{width:1em;height:1em;vertical-align:-.12em;margin-right:.3em}

h1,h2,h3{margin:0}
.h-sec{font:700 1.6rem/1.1 var(--display);margin:30px 0 10px}
.mute{color:var(--mute)}
.empty{color:var(--mute);margin:8px 0}

/* Estado de conexión */
#status{position:sticky;top:0;z-index:5;background:var(--danger);color:#fff;text-align:center;padding:8px 12px;font-weight:700}
#status[hidden]{display:none}

/* Inicio: placas de cuadrilla */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (min-width:640px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;gap:6px;padding:12px;background:var(--card);border:2px solid var(--ink);border-radius:4px;text-decoration:none;box-shadow:0 0 0 var(--ink)}
.card h2{font:700 1.5rem/1.05 var(--display);overflow-wrap:anywhere}
.card .addr{font-size:.9rem;color:var(--mute);min-height:1.35em;overflow-wrap:anywhere}
.plate{aspect-ratio:5/3;display:grid;place-items:center;background:var(--tape);color:#11181F;border-radius:2px;font:800 clamp(3.6rem,19vw,6.2rem)/1 var(--display)}
.card .counts{font-size:.9rem}
.card.bodega{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card.bodega .addr,.card.bodega .counts{color:var(--paper)}
.card.bodega .plate{background:repeating-linear-gradient(-45deg,var(--tape) 0 14px,#11181F 14px 28px)}
.card.new{align-items:center;justify-content:center;border-style:dashed;border-color:var(--concrete);background:transparent;color:var(--mute);cursor:pointer;min-height:180px;font-weight:700}
.card.new span{font:700 3.4rem/1 var(--display);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){
  .card{transition:transform .12s,box-shadow .12s}
  a.card:hover,.card.new:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
}

/* Detalle de cuadrilla */
.back{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;margin:14px 0 0 -8px;color:var(--concrete)}
.back:hover{color:var(--ink)}
.back svg{width:26px;height:26px;fill:currentColor}
.head{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:end}
@media (max-width:520px){.head{grid-template-columns:1fr}}
.ghost{width:100%;background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;padding:4px 0;min-width:0}
.ghost:hover,.ghost:focus{border-bottom-color:var(--concrete);outline:none}
.ghost:focus-visible{border-bottom-color:var(--plan)}
.ghost.title{font:800 clamp(1.9rem,7vw,2.6rem)/1.05 var(--display)}
.ghost.sub{text-align:right}
@media (max-width:520px){.ghost.sub{text-align:left}}
.lead{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.lead label{color:var(--mute);white-space:nowrap}
.lead .ghost{font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin:20px 0 6px}
.tabs a{text-align:center;text-decoration:none;font:700 1.5rem/1 var(--display);padding:12px 4px 10px;border-bottom:3px solid var(--concrete)}
.tabs a[aria-current="page"]{border-bottom:6px solid var(--tape);padding-bottom:7px}

/* Listas de cantidades */
ul{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;background:var(--tint);border-radius:6px;padding:4px 6px 4px 12px;min-height:48px}
.row .n{flex:1;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:4px}
.qty b{min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.sq{width:40px;height:40px;border:0;border-radius:6px;background:var(--card);cursor:pointer;font-size:1.25rem;line-height:1;font-weight:700}
.sq:hover{background:var(--tape);color:#11181F}
.sq.x{background:transparent;color:var(--mute);font-weight:400}
.sq.x:hover{background:transparent;color:var(--danger)}

/* Formularios */
input,textarea{background:var(--card);border:1px solid var(--concrete);border-radius:6px;padding:10px 12px;min-width:0}
textarea{width:100%;resize:vertical;min-height:84px}
.add{display:grid;grid-template-columns:1fr 84px 96px auto;gap:6px;margin-top:6px}
.add.two{grid-template-columns:1fr 84px auto}
.add.one{grid-template-columns:1fr auto}
@media (max-width:520px){.add input[name=n]{grid-column:1/-1}.add{grid-template-columns:1fr 1fr auto}.add.two{grid-template-columns:1fr auto}.add.one{grid-template-columns:1fr auto}.add.one input[name=n],.add.two input[name=n]{grid-column:auto}}
.btn{background:var(--tape);color:#11181F;border:2px solid #11181F;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn:hover{background:#FFD83A}
.btn.ghosty{background:transparent;color:var(--ink);border-color:var(--concrete)}
.link-danger{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;padding:12px 0;margin-top:28px}
.link-danger:hover{color:var(--danger)}

/* Personas */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-bottom:8px}
.chip{display:flex;align-items:center;background:var(--tint);border-radius:6px;padding:2px 2px 2px 12px;min-height:44px}
.chip span{flex:1;overflow-wrap:anywhere}

/* Avisos */
.post{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.post .who{max-width:260px}
.aviso{border-left:6px solid var(--tape);background:var(--card);padding:10px 14px;margin-bottom:12px;border-radius:0 6px 6px 0}
.aviso p{margin:2px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.aviso .meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--mute)}
.aviso .meta button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:6px 0}
.aviso .meta button:hover{color:var(--danger)}

/* Búsquedas */
.search{width:100%;font-size:1.05rem;padding:12px 14px;margin-bottom:18px}
.res{background:var(--card);border:1px solid var(--concrete);border-left:6px solid var(--tape);border-radius:0 6px 6px 0;padding:10px 14px;margin-bottom:10px}
.res strong{font-size:1.1rem}
.res .where{margin:2px 0 0}
.tag{font-size:.82rem;background:var(--tint);border-radius:4px;padding:1px 7px;margin-left:6px}
.inv{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
@media (max-width:560px){.inv{grid-template-columns:1fr}}
a.row{text-decoration:none}
a.row:hover{background:var(--concrete)}
.row .t{font-weight:700;font-variant-numeric:tabular-nums;padding-right:8px;white-space:nowrap}
.loc{margin:0 0 14px}
.loc b{font:700 1.3rem/1.2 var(--display)}

dialog{border:2px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(17,24,31,.55)}
dialog form{display:flex;flex-direction:column;gap:12px}
dialog label{display:flex;flex-direction:column;gap:4px;font-weight:700}
dialog label input{font-weight:400}
dialog .actions{display:flex;gap:8px;justify-content:flex-end}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div id="status" role="alert" hidden>Sin conexión con el servidor. Los últimos cambios podrían no haberse guardado.</div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#/">Construcción Misiones</a>
    <nav class="nav" aria-label="Secciones">
      <a href="#/avisos" data-nav="avisos">Avisos</a>
      <a href="#/alumnos" data-nav="alumnos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Alumnos</a>
      <a href="#/inventario" data-nav="inventario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>Inventario</a>
    </nav>
  </header>
  <main id="view" aria-live="polite"><p class="empty">Cargando…</p></main>
</div>

<dialog id="dlg">
  <form id="newc" method="dialog">
    <h2 class="h-sec" style="margin:0">Nueva cuadrilla</h2>
    <label>Nombre<input name="name" required maxlength="60"></label>
    <label>Dirección de la obra<input name="address" maxlength="120" placeholder="Calle y número"></label>
    <label>A cargo de<input name="lead" maxlength="60"></label>
    <div class="actions">
      <button class="btn ghosty" type="button" data-act="closedlg">Cancelar</button>
      <button class="btn" type="submit">Crear cuadrilla</button>
    </div>
  </form>
</dialog>

<script>
const PARROQUIA = 1;
const S = { cuad: [], avisos: [], ready: false, q: { alumnos: "", inventario: "" } };
const $ = s => document.querySelector(s);
const view = $("#view"), dlg = $("#dlg");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const qtxt = (q, u) => q + (u ? " " + u : "");
const cuad = id => S.cuad.find(c => c.id == id);
const regulares = () => S.cuad.filter(c => !c.parroquia);
const BACK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3 5 12l12 9z"/></svg>';

/* ---------- Conexión con el servidor ---------- */
const status = ok => { $("#status").hidden = ok; };
async function call(method, url, body) {
  try {
    const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status);
    status(true);
    return r.json();
  } catch (e) { console.error(e); status(false); return null; }
}
// Un guardado a la vez por cuadrilla, siempre con el último estado.
const chain = {};
function save(c) {
  chain[c.id] = (chain[c.id] || Promise.resolve()).then(() => call("PUT", "/api/cuadrillas/" + c.id, cuad(c.id) || c));
}
async function load(force) {
  const [a, b] = await Promise.all([call("GET", "/api/cuadrillas"), call("GET", "/api/avisos")]);
  if (!a || !b) return;
  const changed = JSON.stringify(a) !== JSON.stringify(S.cuad) || JSON.stringify(b) !== JSON.stringify(S.avisos);
  S.cuad = a; S.avisos = b;
  if (changed || !S.ready || force) { S.ready = true; render(); }
}

/* ---------- Vistas ---------- */
function home() {
  const par = S.cuad.find(c => c.parroquia);
  const cards = [];
  if (par) cards.push(`<a class="card bodega" href="#/c/${par.id}"><h2>${esc(par.name)}</h2><div class="addr">Bodega central</div><div class="plate" role="img" aria-label="Bodega"></div><div class="counts">${plural(par.materials.length, "material", "materiales")} · ${plural(par.tools.length, "herramienta", "herramientas")}</div></a>`);
  for (const c of regulares()) {
    const n = (c.name.match(/\d+/) || [c.name.trim()[0] || "?"])[0];
    cards.push(`<a class="card" href="#/c/${c.id}"><h2>${esc(c.name)}</h2><div class="addr">${esc(c.address)}</div><div class="plate" aria-hidden="true">${esc(n)}</div><div class="counts">${plural(c.alumnos.length, "alumno", "alumnos")} · ${plural(c.motor.length, "del equipo", "del equipo")}</div></a>`);
  }
  cards.push(`<button class="card new" type="button" data-act="newc"><span aria-hidden="true">+</span>Nueva cuadrilla</button>`);
  const hint = regulares().length ? "" : '<p class="empty">Todavía no hay cuadrillas. Crea la primera con “Nueva cuadrilla”.</p>';
  return `<div class="cards">${cards.join("")}</div>${hint}`;
}

function qtyList(c, k) {
  const a = c[k];
  if (!a.length) return `<p class="empty">${k === "materials" ? "Sin materiales todavía." : "Sin herramientas todavía."}</p>`;
  return "<ul>" + a.map((it, i) => `<li class="row"><span class="n">${esc(it.n)}</span><span class="qty"><button class="sq" data-act="qty" data-d="-1" data-id="${c.id}" data-k="${k}" data-i="${i}" aria-label="Quitar uno de ${esc(it.n)}">−</button><b>${esc(qtxt(it.q, it.u))}</b><button class="sq" data-act="qty" data-d="1" data-id="${c.id}" data-k="${k}" data-i="${i}" aria-label="Sumar uno a ${esc(it.n)}">+</button></span><button class="sq x" data-act="del" data-id="${c.id}" data-k="${k}" data-i="${i}" aria-label="Quitar ${esc(it.n)}">×</button></li>`).join("") + "</ul>";
}
const addQty = (c, k, ph, cls, unit) => `<form class="add ${cls}" data-add="${k}" data-id="${c.id}"><input name="n" placeholder="${ph}" required maxlength="60" aria-label="${ph}"><input name="q" type="number" min="1" value="1" inputmode="numeric" aria-label="Cantidad">${unit ? '<input name="u" placeholder="unidad" maxlength="12" aria-label="Unidad">' : ""}<button class="btn" type="submit">Agregar</button></form>`;

function chipList(c, k) {
  const a = c[k];
  if (!a.length) return `<p class="empty">Nadie registrado todavía.</p>`;
  return '<div class="chips">' + a.map((n, i) => `<div class="chip"><span>${esc(n)}</span><button class="sq x" data-act="del" data-id="${c.id}" data-k="${k}" data-i="${i}" aria-label="Quitar a ${esc(n)}">×</button></div>`).join("") + "</div>";
}
const addPerson = (c, k) => `<form class="add one" data-add="${k}" data-id="${c.id}"><input name="n" placeholder="Nombre" required maxlength="60" aria-label="Nombre"><button class="btn" type="submit">Agregar</button></form>`;

function detail(id, tab) {
  const c = cuad(id);
  if (!c) return `<a class="back" href="#/" aria-label="Volver a las cuadrillas">${BACK}</a><p class="empty">Esa cuadrilla ya no existe.</p>`;
  if (c.parroquia) tab = "materiales";
  const tabs = c.parroquia ? "" : `<nav class="tabs" aria-label="Contenido de la cuadrilla"><a href="#/c/${c.id}/materiales"${tab === "materiales" ? ' aria-current="page"' : ""}>Materiales</a><a href="#/c/${c.id}/personas"${tab === "personas" ? ' aria-current="page"' : ""}>Personas</a></nav>`;
  const body = tab === "personas"
    ? `<h2 class="h-sec">Equipo motor</h2>${chipList(c, "motor")}${addPerson(c, "motor")}<h2 class="h-sec">Alumnos</h2>${chipList(c, "alumnos")}${addPerson(c, "alumnos")}`
    : `<h2 class="h-sec">Materiales</h2>${qtyList(c, "materials")}${addQty(c, "materials", "Material", "", true)}<h2 class="h-sec">Herramientas</h2>${qtyList(c, "tools")}${addQty(c, "tools", "Herramienta", "two", false)}`;
  const del = c.parroquia ? "" : `<button class="link-danger" data-act="rmc" data-id="${c.id}">Eliminar cuadrilla</button>`;
  return `<a class="back" href="#/" aria-label="Volver a las cuadrillas">${BACK}</a>
  <div class="head"><input class="ghost title" data-f="name" data-id="${c.id}" value="${esc(c.name)}" aria-label="Nombre de la cuadrilla" maxlength="60"><input class="ghost sub" data-f="address" data-id="${c.id}" value="${esc(c.address)}" placeholder="Agregar dirección" aria-label="Dirección de la obra" maxlength="120"></div>
  ${c.parroquia ? "" : `<div class="lead"><label for="lead">A cargo de</label><input class="ghost" id="lead" data-f="lead" data-id="${c.id}" value="${esc(c.lead)}" placeholder="Sin asignar" maxlength="60"></div>`}
  ${tabs}${body}${del}`;
}

const when = iso => { try { return new Date(iso).toLocaleString("es-CL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };
function avisos() {
  let autor = ""; try { autor = localStorage.getItem("autor") || ""; } catch {}
  const list = S.avisos.length
    ? S.avisos.map(a => `<article class="aviso"><strong>${esc(a.author)}:</strong><p>${esc(a.text)}</p><div class="meta"><span>${esc(when(a.ts))}</span><button data-act="delaviso" data-id="${a.id}">Borrar</button></div></article>`).join("")
    : '<p class="empty">Todavía no hay avisos. Escribe el primero, por ejemplo: “Alguien tiene el nivel grande”.</p>';
  return `<form class="post" id="post"><input class="who" name="author" placeholder="Tu nombre" required maxlength="60" aria-label="Tu nombre" value="${esc(autor)}"><textarea name="text" placeholder="¿Qué necesitas avisar?" required maxlength="1000" aria-label="Mensaje"></textarea><button class="btn" type="submit" style="align-self:flex-start">Publicar aviso</button></form>${list}`;
}

function alumnosResults() {
  const q = norm(S.q.alumnos), hits = [];
  for (const c of S.cuad) if (!c.parroquia) {
    for (const n of c.alumnos) if (norm(n).includes(q)) hits.push({ n, c, role: "" });
    for (const n of c.motor) if (norm(n).includes(q)) hits.push({ n, c, role: "Equipo motor" });
  }
  if (!hits.length) return `<p class="empty">${q ? "No encontramos a nadie con ese nombre." : "Todavía no hay alumnos registrados. Agrégalos dentro de cada cuadrilla, en Personas."}</p>`;
  hits.sort((a, b) => a.n.localeCompare(b.n, "es"));
  return hits.slice(0, 150).map(h => `<div class="res"><strong>${esc(h.n)}</strong>${h.role ? `<span class="tag">${h.role}</span>` : ""}<p class="where">se encuentra en <a href="#/c/${h.c.id}/personas">${esc(h.c.name)}</a>${h.c.address ? `<br>${esc(h.c.address)}` : ""}${h.c.lead ? `<br>a cargo de ${esc(h.c.lead)}` : ""}</p></div>`).join("");
}
const alumnos = () => `<input class="search" type="search" data-q="alumnos" placeholder="Buscar alumno por nombre" aria-label="Buscar alumno por nombre" value="${esc(S.q.alumnos)}"><div id="results" aria-live="polite">${alumnosResults()}</div>`;

function inventory() {
  const m = new Map();
  for (const c of S.cuad) for (const kind of ["materials", "tools"]) for (const it of c[kind]) {
    const key = `${kind}:${norm(it.n)}:${norm(it.u || "")}`;
    const e = m.get(key) || { key, kind, n: it.n, u: it.u || "", total: 0, where: new Map() };
    e.total += it.q; e.where.set(c.id, (e.where.get(c.id) || 0) + it.q);
    m.set(key, e);
  }
  return m;
}
function inventarioResults() {
  const q = norm(S.q.inventario), inv = [...inventory().values()].filter(e => norm(e.n).includes(q));
  const col = (kind, title) => {
    const a = inv.filter(e => e.kind === kind).sort((x, y) => x.n.localeCompare(y.n, "es"));
    return `<section><h2 class="h-sec">${title}</h2>${a.length ? "<ul>" + a.map(e => `<li><a class="row" href="#/inventario/${encodeURIComponent(e.key)}"><span class="n">${esc(e.n)}</span><span class="t">${esc(qtxt(e.total, e.u))}</span></a></li>`).join("") + "</ul>" : `<p class="empty">${q ? "Nada con ese nombre." : "Sin registros todavía."}</p>`}</section>`;
  };
  return `<div class="inv">${col("tools", "Herramientas")}${col("materials", "Materiales")}</div>`;
}
const inventario = () => `<input class="search" type="search" data-q="inventario" placeholder="Buscar en inventario" aria-label="Buscar en inventario" value="${esc(S.q.inventario)}"><div id="results">${inventarioResults()}</div>`;

function item(key) {
  const e = inventory().get(key);
  const back = `<a class="back" href="#/inventario" aria-label="Volver al inventario">${BACK}</a>`;
  if (!e) return `${back}<p class="empty">Ese artículo ya no está en el inventario.</p>`;
  const par = S.cuad.find(c => c.parroquia);
  const locs = regulares().filter(c => e.where.get(c.id) > 0).map(c => `<p class="loc"><b>${esc(qtxt(e.where.get(c.id), e.u))} en <a href="#/c/${c.id}/materiales">${esc(c.name)}</a></b>${c.address ? `<br>${esc(c.address)}` : ""}${c.lead ? `<br>a cargo de ${esc(c.lead)}` : ""}</p>`).join("");
  const pq = par ? `<p class="loc"><b>${esc(qtxt(e.where.get(par.id) || 0, e.u))} en <a href="#/c/${par.id}">Parroquia</a></b></p>` : "";
  return `${back}<h1 class="h-sec" style="font-size:2.4rem">${esc(e.n)}</h1><p class="mute">Total: ${esc(qtxt(e.total, e.u))}. Se encuentra en:</p>${locs}${pq}`;
}

/* ---------- Router ---------- */
function render() {
  const h = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  const page = h[0] || "";
  document.querySelectorAll("[data-nav]").forEach(a => a.toggleAttribute("aria-current", a.dataset.nav === page));
  document.querySelectorAll("[data-nav][aria-current]").forEach(a => a.setAttribute("aria-current", "page"));
  if (!S.ready) return;
  let html, title = "Construcción Misiones";
  if (page === "c") { html = detail(h[1], h[2] === "personas" ? "personas" : "materiales"); title = (cuad(h[1])?.name || "Cuadrilla") + " · " + title; }
  else if (page === "avisos") { html = avisos(); title = "Avisos · " + title; }
  else if (page === "alumnos") { html = alumnos(); title = "Alumnos · " + title; }
  else if (page === "inventario") { html = h[1] ? item(h[1]) : inventario(); title = "Inventario · " + title; }
  else html = home();
  view.innerHTML = html;
  document.title = title;
}
window.addEventListener("hashchange", () => { render(); scrollTo(0, 0); });

/* ---------- Acciones ---------- */
const refocus = sel => { const el = view.querySelector(sel); if (el) el.focus(); };

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, c = cuad(b.dataset.id), k = b.dataset.k, i = +b.dataset.i;
  if (act === "newc") {
    const n = regulares().length + 1;
    dlg.querySelector("[name=name]").value = "Cuadrilla " + n;
    dlg.showModal(); dlg.querySelector("[name=name]").select(); return;
  }
  if (act === "closedlg") return dlg.close();
  if (act === "delaviso") {
    if (!confirm("¿Borrar este aviso?")) return;
    S.avisos = S.avisos.filter(a => a.id != b.dataset.id); render();
    return void call("DELETE", "/api/avisos/" + b.dataset.id);
  }
  if (!c) return;
  if (act === "rmc") {
    if (!confirm(`¿Eliminar ${c.name}? Se borrarán sus materiales, herramientas y personas.`)) return;
    S.cuad = S.cuad.filter(x => x !== c); location.hash = "#/";
    return void call("DELETE", "/api/cuadrillas/" + c.id);
  }
  if (act === "del") c[k].splice(i, 1);
  if (act === "qty") c[k][i].q = Math.max(0, c[k][i].q + +b.dataset.d);
  save(c); render();
});

document.addEventListener("submit", async e => {
  const f = e.target;
  if (f.id === "newc") {
    e.preventDefault();
    const d = new FormData(f);
    const c = { id: Date.now(), name: d.get("name").trim(), address: d.get("address").trim(), lead: d.get("lead").trim(), motor: [], alumnos: [], materials: [], tools: [] };
    if (!c.name) return;
    S.cuad.push(c); f.reset(); dlg.close(); save(c); location.hash = "#/c/" + c.id; return;
  }
  e.preventDefault();
  const d = new FormData(f);
  if (f.id === "post") {
    try { localStorage.setItem("autor", d.get("author").trim()); } catch {}
    const a = await call("POST", "/api/avisos", { author: d.get("author"), text: d.get("text") });
    if (a) { S.avisos.unshift(a); render(); }
    return;
  }
  const c = cuad(f.dataset.id), k = f.dataset.add, n = (d.get("n") || "").trim();
  if (!c || !n) return;
  if (k === "motor" || k === "alumnos") c[k].push(n);
  else c[k].push({ n, q: Math.max(1, +d.get("q") || 1), ...(k === "materials" ? { u: (d.get("u") || "").trim() } : {}) });
  save(c); render();
  refocus(`form[data-add="${k}"] input[name=n]`);
});

document.addEventListener("change", e => {
  const t = e.target, c = t.dataset.f && cuad(t.dataset.id); if (!c) return;
  const v = t.value.trim();
  if (t.dataset.f === "name" && !v) { t.value = c.name; return; }
  c[t.dataset.f] = v; save(c);
});

document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset.q) return;
  S.q[t.dataset.q] = t.value;
  $("#results").innerHTML = t.dataset.q === "alumnos" ? alumnosResults() : inventarioResults();
});

// Actualiza lo que editan otras personas, sin interrumpir a quien está escribiendo.
setInterval(() => {
  const a = document.activeElement;
  if (document.hidden || (a && /INPUT|TEXTAREA/.test(a.tagName) && a.value)) return;
  load();
}, 15000);

render(); load();
</script>
</body>
</html>
